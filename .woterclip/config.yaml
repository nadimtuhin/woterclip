# WoterClip Configuration
# Created by /woterclip-init – customize for your repo
version: 2

backend: sqlite

# Project-level goal (optional context for all personas)
project_goal: "Build a flexible agent orchestration platform for Claude"

board:
  user_name: "Nadim"           # Board user's display name (used in @-mentions)

# Heartbeat behavior
heartbeat:
  max_issues_per_heartbeat: 2        # Max issues to work per heartbeat cycle
  max_parallel: 2                    # Max issues processed simultaneously (SQLite is WAL-safe)
  stale_lock_hours: 4                # Hours before a lockfile is considered stale

  # Quiet hours – skip or limit heartbeats during off-hours
  quiet_hours:
    enabled: false
    timezone: "America/Los_Angeles"
    start: "22:00"
    end: "07:00"
    behavior: "skip"                 # "skip" = no heartbeat; "triage-only" = orchestrator triage only

  # Error cooldown – back off on repeated failures
  cooldown:
    max_consecutive_failures: 3      # Pause schedule after N failures
    backoff_multiplier: 2            # Double interval on consecutive failures

# SQLite backend configuration (local database)
sqlite:
  database_path: ".woterclip/issues.db"

# Label configuration (for future Linear migrations)
labels:
  group: "WoterClip"                 # Parent label group
  working: "agent-working"           # Applied while agent is working an issue
  blocked: "agent-blocked"           # Applied when agent is blocked

# Persona routing: Label → persona directory
# The Orchestrator (is_default: true) handles issues with no persona label
personas:
  orchestrator:
    path: "personas/orchestrator"
    label: null
    is_default: true
  ceo:
    path: "personas/ceo"
    label: "ceo"
  backend:
    path: "personas/backend"
    label: "backend"
  frontend:
    path: "personas/frontend"
    label: "frontend"
  architect:
    path: "personas/architect"
    label: "architect"
  qa:
    path: "personas/qa"
    label: "qa"
  backlog-groomer:
    path: "personas/backlog-groomer"
    label: "backlog-groomer"
  loop:
    path: "personas/loop"
    label: "loop"
  schedule-manager:
    path: "personas/schedule-manager"
    label: "schedule-manager"
