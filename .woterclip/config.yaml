version: 2
backend: sqlite
project_goal: Build a flexible agent orchestration platform for Claude
board:
  user_name: Nadim
heartbeat:
  max_issues_per_heartbeat: 2
  max_parallel: 2
  stale_lock_hours: 4
  quiet_hours:
    enabled: false
    timezone: America/Los_Angeles
    start: '22:00'
    end: 07:00
    behavior: skip
  cooldown:
    max_consecutive_failures: 3
    backoff_multiplier: 2
sqlite:
  database_path: .woterclip/issues.db
labels:
  group: WoterClip
  working: agent-working
  blocked: agent-blocked
personas:
  orchestrator:
    path: personas/orchestrator
    label: null
    is_default: true
  ceo:
    path: personas/ceo
    label: ceo
  backend:
    path: personas/backend
    label: backend
  frontend:
    path: personas/frontend
    label: frontend
  architect:
    path: personas/architect
    label: architect
  qa:
    path: personas/qa
    label: qa
  backlog-groomer:
    path: personas/backlog-groomer
    label: backlog-groomer
  loop:
    path: personas/loop
    label: loop
  schedule-manager:
    path: personas/schedule-manager
    label: schedule-manager
