# WoterClip Configuration
# Created by /woterclip-init – customize for your repo
version: 2

backend: sqlite

# Project-level goal (optional context for all personas)
project_goal: ""

board:
  user_name: "{{USER_NAME}}"         # Board user's display name (used in @-mentions)

# only used when backend: linear
linear:
  team: "{{TEAM}}"                   # Default team for new issues/sub-issues
  project: null                      # Optional: scope inbox to a specific project

# Heartbeat behavior
heartbeat:
  max_issues_per_heartbeat: 2        # Max issues to work per heartbeat cycle
  max_parallel: 2                    # Max issues processed simultaneously (1 for linear, 2+ for sqlite)
  stale_lock_hours: 4                # Hours before a lockfile is considered stale

  # Quiet hours – skip or limit heartbeats during off-hours
  quiet_hours:
    enabled: false
    timezone: "America/Los_Angeles"
    start: "22:00"
    end: "07:00"
    behavior: "skip"                 # "skip" = no heartbeat; "triage-only" = orchestrator triage only

  # Error cooldown – back off on repeated failures
  cooldown:
    max_consecutive_failures: 3      # Pause schedule after N failures
    backoff_multiplier: 2            # Double interval on consecutive failures

# Linear label configuration
labels:
  group: "WoterClip"                 # Parent label group (auto-created by init)
  working: "agent-working"           # Applied while agent is working an issue
  blocked: "agent-blocked"           # Applied when agent is blocked

# Persona routing: Linear label → persona directory
# The Orchestrator (is_default: true) handles issues with no persona label
personas:
  orchestrator:
    path: "personas/orchestrator"
    label: null
    is_default: true
  ceo:
    path: "personas/ceo"
    label: "ceo"
  architect:
    path: "personas/architect"
    label: "architect"
  qa:
    path: "personas/qa"
    label: "qa"
  backend:
    path: "personas/backend"
    label: "backend"
  frontend:
    path: "personas/frontend"
    label: "frontend"
  backlog-groomer:
    path: "personas/backlog-groomer"
    label: "backlog-groomer"

# Webhook Listener Configuration (Phase 2, optional)
# If enabled, the HTTP listener receives webhooks from GitHub/Linear
# and queues them for processing via /heartbeat --source/--event-id
webhook_listener:
  enabled: false                     # Set to true to enable listener
  port: ${WEBHOOK_LISTENER_PORT:-3000}
  host: "0.0.0.0"

  dedup_cache:
    ttl_hours: 24                    # Cache entry time-to-live
    backend: "memory"                # "memory" (Phase 2) or "redis" (Phase 3)
    redis_url: ${REDIS_URL:-null}    # Only for redis backend

  queue:
    backend: "sqlite"                # "sqlite" (Phase 2) or "redis" (Phase 3)
    retention_hours: 48              # How long to keep completed/failed events

  max_queue_depth: 100               # Reject if queue exceeds this size
  request_timeout_ms: 5000           # Request timeout per webhook

  metrics_enabled: true              # Expose GET /metrics endpoint

  # Rate limiting (Phase 2)
  rate_limit:
    enabled: true
    per_source_rpm: 100              # Per source IP, per minute
    global_rpm: 1000                 # Total requests/minute
